name: ci

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy conduit scripts

      - name: Test
        run: pytest

  # Read-only checks against the real CRM sandbox.
  #
  # Kept out of the push path on purpose: it depends on a third-party deployment
  # being up, and a red build should mean our code is wrong, not that someone
  # else's sandbox is asleep. Run it by hand from the Actions tab.
  #
  # It also exists because development here happens behind a VPN whose exit
  # address the platform in front of the CRM challenges. CI has a clean egress;
  # laptops do not.
  live-crm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: crm-sandbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Raw evidence before the assertions run. If the platform in front of the
      # CRM challenges this runner the way it challenges a VPN exit, the headers
      # say so plainly and the test failures below are noise.
      - name: Probe egress and headers
        continue-on-error: true
        env:
          ITMANO_CRM_BASE_URL: ${{ vars.ITMANO_CRM_BASE_URL }}
          ITMANO_CRM_TOKEN: ${{ secrets.ITMANO_CRM_TOKEN }}
        run: |
          echo "runner egress: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          echo
          echo "--- control host (not ours) ---"
          curl -s -o /dev/null -w 'nextjs.org -> %{http_code}\n' --max-time 15 https://nextjs.org/ || true
          echo
          echo "--- GET /api/agent/v1/whoami ---"
          curl -si --max-time 20 \
            -H "Authorization: Bearer ${ITMANO_CRM_TOKEN}" \
            "${ITMANO_CRM_BASE_URL}/api/agent/v1/whoami" | head -40 || true
          echo
          echo "--- GET /api/agent/v1/openapi.json (no auth) ---"
          curl -si --max-time 20 \
            "${ITMANO_CRM_BASE_URL}/api/agent/v1/openapi.json" | head -20 || true

      - name: Live read-only checks
        env:
          ITMANO_CRM_BASE_URL: ${{ vars.ITMANO_CRM_BASE_URL }}
          ITMANO_CRM_TOKEN: ${{ secrets.ITMANO_CRM_TOKEN }}
          ITMANO_CRM_EXPECTED_TENANT: ${{ vars.ITMANO_CRM_EXPECTED_TENANT }}
          ITMANO_CRM_EXPECTED_ENVIRONMENT: ${{ vars.ITMANO_CRM_EXPECTED_ENVIRONMENT }}
        run: pytest -m live -v

  # What a tool call actually costs, through the real invocation path.
  #
  # Runs after live-crm rather than beside it: together they are ~65 requests
  # against a token allowed 120/min, and two parallel jobs could collide. It
  # also makes no sense to measure a surface whose checks just failed.
  crm-latency:
    if: github.event_name == 'workflow_dispatch'
    needs: live-crm
    runs-on: ubuntu-latest
    environment: crm-sandbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Measure
        env:
          ITMANO_CRM_BASE_URL: ${{ vars.ITMANO_CRM_BASE_URL }}
          ITMANO_CRM_TOKEN: ${{ secrets.ITMANO_CRM_TOKEN }}
          ITMANO_CRM_EXPECTED_TENANT: ${{ vars.ITMANO_CRM_EXPECTED_TENANT }}
          ITMANO_CRM_EXPECTED_ENVIRONMENT: ${{ vars.ITMANO_CRM_EXPECTED_ENVIRONMENT }}
        run: python scripts/measure_crm_latency.py | tee -a "$GITHUB_STEP_SUMMARY"
